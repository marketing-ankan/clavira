<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Offline — Clavira</title>
    <style>
        :root { color-scheme: light; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
            background: #faf7f2;
            color: #1a1714;
            font-family: Jost, "Helvetica Neue", Arial, sans-serif;
            text-align: center;
        }
        .wrap { max-width: 26rem; }
        img { width: 190px; max-width: 70%; height: auto; margin-bottom: 2.25rem; }
        .eyebrow {
            text-transform: uppercase;
            letter-spacing: 0.3em;
            font-size: 0.72rem;
            font-weight: 500;
            color: #7a5f34;
            margin: 0 0 0.75rem;
        }
        h1 {
            font-family: "Cormorant Garamond", Georgia, serif;
            font-weight: 400;
            font-size: 2rem;
            line-height: 1.2;
            margin: 0 0 1rem;
        }
        p { color: #5a5044; line-height: 1.7; margin: 0 0 2rem; font-size: 0.95rem; }
        button {
            font: inherit;
            font-size: 0.78rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            background: #b08d57;
            color: #fff;
            border: 0;
            padding: 0.95rem 2.25rem;
            cursor: pointer;
        }
        button:hover { background: #1a1714; }
        button:focus-visible { outline: 2px solid #1a1714; outline-offset: 3px; }
    </style>
</head>
<body>
    <div class="wrap">
        <img src="/images/brand/clavira-wordmark.png" alt="Clavira">
        <p class="eyebrow">No connection</p>
        <h1>The atelier is just out of reach</h1>
        <p>
            You appear to be offline. Your cart and wishlist are safe — reconnect
            and everything will be exactly where you left it.
        </p>
        <button type="button" onclick="location.reload()">Try again</button>
    </div>
</body>
</html>
